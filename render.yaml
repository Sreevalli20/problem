services:
  - type: web
    name: brandforge-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://brandforge-ai.vercel.app
